## nginx.conf — catalyst.luislimon.dev
## ─────────────────────────────────────────────────────────────────────────────
## THEORY: How a reverse proxy works
## Without Nginx, Streamlit would sit directly on the internet.
## Anyone knowing your IP + port (8501) could hit it directly.
## Nginx sits in front — it's the only thing the internet talks to.
## Streamlit becomes completely invisible externally.
## This pattern is called a reverse proxy:
##   Client → Nginx (public) → Streamlit (private)
## ─────────────────────────────────────────────────────────────────────────────

## ── Rate limiting ─────────────────────────────────────────────────────────────
## THEORY: Rate limiting is a token bucket algorithm
## Each IP gets a bucket that refills at rate=10r/s (10 tokens per second)
## Each request costs 1 token
## burst=20 means the bucket can hold 20 tokens maximum
## If a visitor sends 30 requests instantly:
##   - First 20 are served (bucket empties)
##   - Remaining 10 are rejected with 429 Too Many Requests
##   - Bucket starts refilling at 10 tokens/second
## This protects your $6 droplet from being overwhelmed by bots or scrapers
## who hit public LinkedIn links trying to find vulnerabilities
limit_req_zone $binary_remote_addr zone=dashboard:10m rate=10r/s;
## $binary_remote_addr = IP address in binary form (4 bytes vs 15 bytes string)
##                       uses less memory — 10m stores ~160,000 unique IPs
## zone=dashboard = name of this bucket pool, referenced inside location {}
## 10m = 10 megabytes of shared memory to store the IP → token bucket mappings

## ── Server Block 1: HTTP → HTTPS redirect ─────────────────────────────────────
## THEORY: Why we need two server blocks
## HTTPS runs on port 443, HTTP runs on port 80
## A visitor might type "catalyst.luislimon.dev" without https://
## Their browser defaults to port 80 (HTTP) first
## This block catches that HTTP request and permanently redirects to HTTPS
## Without this block, the dashboard would be unreachable over HTTP instead of
## automatically upgrading — bad UX and unprofessional on a LinkedIn project
server {
    listen 80;                          ## listen on port 80 = HTTP
    server_name catalyst.luislimon.dev; ## only respond to this exact domain

    ## 301 = permanent redirect (vs 302 = temporary)
    ## Browsers cache 301s — after first visit, browser goes straight to HTTPS
    ## Search engines also follow 301s and index the HTTPS version
    ## $host = original domain requested, $request_uri = path + query string
    ## e.g. http://catalyst.luislimon.dev/options → https://catalyst.luislimon.dev/options
    return 301 https://$host$request_uri;
}

## ── Server Block 2: HTTPS — the actual dashboard ──────────────────────────────
server {
    listen 443 ssl;                     ## listen on port 443 = HTTPS
    server_name catalyst.luislimon.dev;

    ## ── SSL/TLS certificates ──────────────────────────────────────────────────
    ## THEORY: How TLS works (simplified)
    ## TLS is the protocol that makes HTTPS secure. When a browser connects:
    ## 1. Server sends its certificate (fullchain.pem) — proves identity
    ## 2. Browser verifies the cert was signed by a trusted authority (Let's Encrypt)
    ## 3. Both sides use the cert to agree on an encryption key
    ## 4. All data from this point is encrypted — nobody in between can read it
    ##
    ## fullchain.pem = your certificate + Let's Encrypt's intermediate certificates
    ##                 chained together so browsers can verify the full trust chain
    ## privkey.pem   = your private key — mathematically paired with the public cert
    ##                 NEVER share or expose this file — whoever has it can impersonate you
    ssl_certificate     /etc/letsencrypt/live/catalyst.luislimon.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalyst.luislimon.dev/privkey.pem;

    ## ── TLS version hardening ─────────────────────────────────────────────────
    ## THEORY: TLS versions
    ## TLS 1.0 (1999) and 1.1 (2006) have known vulnerabilities (POODLE, BEAST attacks)
    ## TLS 1.2 (2008) is still secure with strong ciphers
    ## TLS 1.3 (2018) is the most secure — removes legacy features that caused past attacks
    ## By specifying only 1.2 and 1.3 we reject connections from very old clients
    ## (essentially IE on Windows XP — not your LinkedIn audience)
    ssl_protocols TLSv1.2 TLSv1.3;

    ## ── Cipher suites ─────────────────────────────────────────────────────────
    ## THEORY: A cipher suite is the combination of algorithms used for:
    ##   - Key exchange (ECDHE = Elliptic Curve Diffie-Hellman Ephemeral)
    ##   - Authentication (RSA or ECDSA)
    ##   - Encryption (AES-128 or AES-256 in GCM mode)
    ##   - Message integrity (SHA256 or SHA384)
    ## ECDHE is critical — "Ephemeral" means a new key is generated per session
    ## So even if your private key is stolen later, past sessions can't be decrypted
    ## This property is called Perfect Forward Secrecy (PFS)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    ## Server picks the cipher from the list above, not the client
    ## Prevents a client deliberately choosing a weaker cipher from our list
    ssl_prefer_server_ciphers off;
    ## off = actually let TLS 1.3 handle its own cipher negotiation (it's better at it)
    ## only affects TLS 1.2 fallback connections

    ## ── Security headers ──────────────────────────────────────────────────────
    ## THEORY: Security headers are instructions sent to the browser
    ## They tell the browser how to behave when rendering your page
    ## Without them, browsers use permissive defaults that attackers can exploit

    ## Prevents your dashboard being embedded invisibly in an attacker's iframe
    ## Attacker overlays their UI on top — user thinks they're clicking their buttons
    ## but actually clicking yours (clickjacking). DENY = nobody can frame this page.
    add_header X-Frame-Options "DENY";

    ## Browsers guess file types by sniffing content, ignoring Content-Type header
    ## An attacker uploads a .jpg that's actually JavaScript — browser executes it
    ## nosniff = trust the server's Content-Type exactly, no guessing
    add_header X-Content-Type-Options "nosniff";

    ## When a user clicks a link leaving your site, browser sends:
    ## Referer: https://catalyst.luislimon.dev/options-chain
    ## That leaks your URL structure to every external site
    ## no-referrer = send nothing, your URLs stay private
    add_header Referrer-Policy "no-referrer";

    ## Explicitly disable browser hardware APIs your dashboard never uses
    ## Even if a malicious dependency tried to access these, browser blocks it
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()";

    ## THEORY: HSTS (HTTP Strict Transport Security)
    ## After a browser sees this header once, it remembers for max-age seconds
    ## During that period it refuses to connect over HTTP at all — goes straight to HTTPS
    ## Prevents SSL stripping attacks where a man-in-the-middle downgrades your connection
    ## max-age=31536000 = 1 year
    ## includeSubDomains = applies to portfolio.luislimon.dev etc. too
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    ## ── Slow Loris protection ─────────────────────────────────────────────────
    ## THEORY: Slow Loris attack
    ## Attacker opens thousands of connections to your server and sends
    ## data extremely slowly — one byte every few seconds
    ## Server keeps each connection open waiting for the request to complete
    ## Eventually server runs out of available connections and goes down
    ## These timeouts kill connections that take too long at any stage
    client_body_timeout 10s;    ## max time to receive the full request body
    client_header_timeout 10s;  ## max time to receive request headers
    keepalive_timeout 30s;      ## max time an idle connection stays open
    send_timeout 10s;           ## max time between bytes sent to the client

    ## Reject oversized requests before processing them
    ## Dashboard has no file uploads so anything over 1MB is suspicious
    client_max_body_size 1M;

    ## Remove Nginx version from Server header and error pages
    ## Default: "Server: nginx/1.25.3" — tells attackers exact version to exploit
    ## After: "Server: nginx" — version unknown
    server_tokens off;

    ## ── Proxy to Streamlit ────────────────────────────────────────────────────
    location / {
        ## Apply rate limiting defined at the top
        ## burst=20 = allow up to 20 queued requests before rejecting
        ## nodelay = reject excess immediately rather than queuing them
        limit_req zone=dashboard burst=20 nodelay;

        ## THEORY: Docker internal DNS
        ## Docker gives each container a hostname matching its service name
        ## "streamlit" resolves to the Streamlit container's private IP automatically
        ## This only works because both containers share the "internal" network
        ## Port 8501 is never published to the host — only reachable this way
        proxy_pass http://streamlit:8501;

        ## Tell Streamlit the original domain (not Nginx's internal hostname)
        proxy_set_header Host $host;

        ## Pass visitor's real IP — without this every request looks like it comes
        ## from Nginx's container IP, making logs and rate limiting useless
        proxy_set_header X-Real-IP $remote_addr;

        ## THEORY: WebSocket upgrade
        ## Streamlit uses WebSockets for live updates (chart rerenders, state changes)
        ## WebSocket starts as a normal HTTP request then sends an "Upgrade" header
        ## asking the server to switch to the WebSocket protocol
        ## Nginx must pass this upgrade request through to Streamlit
        ## Without these three lines: page loads but nothing updates live
        proxy_http_version 1.1;                     ## HTTP/1.1 required — WebSocket not in HTTP/1.0
        proxy_set_header Upgrade $http_upgrade;     ## pass the upgrade request through
        proxy_set_header Connection "upgrade";      ## complete the protocol switch

        ## Keep WebSocket connections alive for 24 hours
        ## Prevents dashboard disconnecting during a long session
        proxy_read_timeout 86400;
    }
}
